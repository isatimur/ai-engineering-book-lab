name: ingest-channel

# Nightly watcher + auto-ingester for the AI Engineer YouTube channel.
#
# Every day at 07:00 UTC: fetches the latest channel inventory via yt-dlp,
# compares against existing 01_Videos/*.md notes. If any are missing, the
# detect job opens/updates a tracking issue AND the ingest job runs the full
# pipeline (notes + transcripts + descriptions + shared-artifacts enrichment)
# and opens a PR — no manual dispatch required.
#
# Manual dispatch is still available: `mode=check` for detect-only (no ingest),
# `mode=ingest` to force the full pipeline + PR even outside the schedule.

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      mode:
        description: 'check (detect only) or ingest (full pipeline + PR)'
        required: false
        default: 'check'
        type: choice
        options:
          - check
          - ingest

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.13'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      missing_count: ${{ steps.dry.outputs.missing_count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install yt-dlp
        run: pip install --quiet --upgrade yt-dlp

      - name: Dry-run channel comparison
        id: dry
        run: |
          set +e
          python 99_Meta/scripts/update_ai_engineer_channel.py --dry-run \
            > /tmp/channel-report.json 2> /tmp/channel-stderr.log
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::update_ai_engineer_channel.py exited with $rc"
            cat /tmp/channel-stderr.log
            echo '{"status":"error","missing_count":0,"error":"update script failed"}' \
              > /tmp/channel-report.json
            cat /tmp/channel-report.json
            # Fail the step (and the job) on a real script failure so the
            # synthetic report below is never mistaken for a verified
            # zero-backlog result. This keeps every downstream issue
            # create/update/close step from running and lets notify-failure
            # fire instead.
            exit "$rc"
          fi
          cat /tmp/channel-report.json
          if ! MISSING=$(jq -er '.missing_count // 0' /tmp/channel-report.json); then
            echo "::error::channel-report.json is not valid JSON — refusing to guess the backlog"
            exit 1
          fi
          # Every step below branches on this being '0' or not '0'. An empty
          # value matches neither, so both the update-issue and close-issue
          # steps skip and the tracker freezes while the job reports success.
          # That is how #67 sat stale from 2026-09-18 to 2026-11-14. Fail loudly
          # instead: a wrong number is visible, a missing one was not.
          case "$MISSING" in
            ''|*[!0-9]*)
              echo "::error::missing_count is not a number: '${MISSING}'"
              exit 1
              ;;
          esac
          echo "missing_count=${MISSING}" >> "$GITHUB_OUTPUT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-report
          path: /tmp/channel-report.json
          retention-days: 30

      - name: Build issue body
        if: ${{ steps.dry.outputs.missing_count != '0' && steps.dry.outputs.missing_count != '' }}
        run: |
          jq -r '
            "## New videos detected on the AI Engineer channel\n\n" +
            "**Detected at:** \(.checked_at // "n/a")\n\n" +
            "| metric | value |\n|---|---|\n" +
            "| inventory size | \(.inventory_count // 0) |\n" +
            "| existing notes | \(.existing_notes // 0) |\n" +
            "| **missing** | **\(.missing_count // 0)** |\n" +
            "| batch name | `\(.batch_name // "n/a")` |\n\n" +
            "### Videos to ingest\n\n" +
            ([.missing_videos[]? |
              "- **#\(.playlist_index)** — [\(.title)](https://www.youtube.com/watch?v=\(.id))"]
              | join("\n")
            ) +
            "\n\n---\n\n### Ingest\n\n" +
            "The ingest pipeline runs automatically on the nightly schedule and opens a PR.\n" +
            "If it did not (check the latest run), re-run locally:\n\n" +
            "```bash\n./99_Meta/scripts/update_ai_engineer_channel.py\n```\n"
          ' /tmp/channel-report.json > /tmp/issue-body.md
          wc -l /tmp/issue-body.md

      - name: Open or update tracking issue when new videos detected
        if: ${{ steps.dry.outputs.missing_count != '0' && steps.dry.outputs.missing_count != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISSING_COUNT: ${{ steps.dry.outputs.missing_count }}
        run: |
          # Ensure labels exist so issue creation never fails on a missing label.
          gh label create ingest --color 1d76db --description "Channel ingest automation" --force
          gh label create automated --color ededed --description "Created by an automated workflow" --force

          # Keep a single live tracking issue instead of opening a new one every run.
          EXISTING=$(gh issue list --label ingest,automated --state open \
            --search "channel-watcher in:title" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" \
              --title "channel-watcher: ${MISSING_COUNT} new video(s) on AI Engineer channel" \
              --body-file /tmp/issue-body.md
            gh issue comment "$EXISTING" --body "Updated: backlog now at ${MISSING_COUNT} video(s)."
          else
            gh issue create \
              --title "channel-watcher: ${MISSING_COUNT} new video(s) on AI Engineer channel" \
              --body-file /tmp/issue-body.md \
              --label "ingest,automated"
          fi

      - name: Close tracking issue when backlog is clear
        if: ${{ steps.dry.outputs.missing_count == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --label ingest,automated --state open \
            --search "channel-watcher in:title" --json number --jq '.[].number'); do
            gh issue comment "$n" --body "Backlog cleared — closing."
            gh issue close "$n"
          done

  ingest:
    needs: detect
    # Auto-ingest on the nightly schedule when missing videos are detected, and
    # on manual `mode=ingest` dispatch. `mode=check` (default) stays detect-only.
    if: ${{ needs.detect.outputs.missing_count != '0' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'ingest')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install yt-dlp
        run: pip install --quiet --upgrade yt-dlp

      # YouTube refuses caption requests from datacenter IPs ("Sign in to
      # confirm you're not a bot"), so a run can finish with every video
      # skipped and no note written. The pipeline exits 0 in that case, and it
      # is right to: a blocked talk must leave no note. But it means a green
      # run proves nothing about the corpus. Keep the log so the next step can
      # report what actually happened.
      #
      # `shell: bash` runs with `-eo pipefail`, unlike the default `bash -e`.
      # Without pipefail a crashed pipeline would exit 0 through `tee` — the
      # same defect this repo fixed in the integrity runner (#92).
      - name: Run full ingest pipeline
        shell: bash
        run: python 99_Meta/scripts/update_ai_engineer_channel.py 2>&1 | tee /tmp/ingest.log

      - name: What did the ingest actually write?
        id: outcome
        shell: bash
        run: |
          # Count notes ON DISK, not the batch summary's own `ingested` figure.
          # That figure has overstated progress before (2026-10-30: logs said 14
          # outstanding, disk said 17). This also counts exactly what
          # create-pull-request would commit.
          NOTES=$(git ls-files --others --exclude-standard -- 01_Videos/ | wc -l | tr -d ' ')
          BLOCKED=$(grep -c '^\[ingest\] SKIP' /tmp/ingest.log || true)

          echo "notes=${NOTES}" >> "$GITHUB_OUTPUT"
          echo "blocked=${BLOCKED}" >> "$GITHUB_OUTPUT"
          if [ "${NOTES}" -gt 0 ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### Ingest outcome"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| notes written | ${NOTES} |"
            echo "| talks blocked by YouTube | ${BLOCKED} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${NOTES}" -eq 0 ]; then
            # Warn, do not fail. `notify-failure` opens a NEW issue on every
            # failed run, so failing here would file one every night and bury
            # the signal. The `gates` workflow sets the pattern worth copying:
            # a check that cannot do its job says so instead of passing.
            echo "::warning::Ingest wrote 0 notes. ${BLOCKED} talk(s) were refused by YouTube from this runner. No pull request will be opened."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**No pull request opened** — nothing was ingested." >> "$GITHUB_STEP_SUMMARY"
          fi

      # YouTube blocks datacenter IPs for per-video requests, so descriptions
      # (like transcripts) usually come back empty here. Non-blocking so the
      # corpus PR still lands, but the script exits non-zero and the health
      # report below states the backfill debt instead of hiding it.
      - name: Refresh descriptions and shared artifacts
        continue-on-error: true
        run: |
          python 99_Meta/scripts/fetch_video_descriptions.py
          python 99_Meta/scripts/build_shared_artifacts.py

      - name: Corpus health report (backfill debt)
        run: python 99_Meta/scripts/corpus_health.py

      - name: Validate note frontmatter and sections
        run: python 99_Meta/scripts/check_note_frontmatter.py

      # Only open a PR when notes were actually written. Before this gate the
      # step ran unconditionally with a fixed body claiming "New video notes in
      # 01_Videos/", so a wholly blocked run still produced a PR whose only
      # diff was a batch-pointer line — PR #94, which asserted notes,
      # transcripts and descriptions it had not created.
      - name: Create pull request with new corpus material
        if: ${{ steps.outcome.outputs.has_notes == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/ingest-channel
          delete-branch: true
          commit-message: |
            feat(corpus): ingest ${{ steps.outcome.outputs.notes }} new AI Engineer channel video(s)

            Automated ingest from nightly channel-watcher workflow.
          title: "feat(corpus): ingest ${{ steps.outcome.outputs.notes }} new AI Engineer channel video(s)"
          body: |
            Automated PR from the nightly channel watcher.

            | metric | value |
            |---|---|
            | notes written | ${{ steps.outcome.outputs.notes }} |
            | talks blocked by YouTube | ${{ steps.outcome.outputs.blocked }} |

            Every figure above is counted from this run. Notes are counted on
            disk, not from the batch summary.

            A blocked talk leaves no note on purpose, so it stays queued for a
            later run. Descriptions usually come back empty from a runner for
            the same reason; the corpus health report states that debt rather
            than hiding it.

            ## Review checklist
            - [ ] Skim the new video notes for accuracy
            - [ ] Verify theme tags look right
            - [ ] Decide whether any new videos should be cited in the manuscript

            Triggered by: `ingest-channel.yml`
          labels: |
            ingest
            automated

      - name: Tell the tracking issue the runner is blocked
        if: ${{ steps.outcome.outputs.has_notes == 'false' && steps.outcome.outputs.blocked != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOCKED: ${{ steps.outcome.outputs.blocked }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Comment on the single live tracking issue rather than opening a new
          # one — same query the detect job uses to find it.
          EXISTING=$(gh issue list --label ingest,automated --state open \
            --search "channel-watcher in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Nightly run wrote **0 notes**: YouTube refused captions for ${BLOCKED} talk(s) from the Actions runner. No pull request opened. The backlog is unchanged and nothing was lost — a blocked talk leaves no note. Run: ${SERVER}/${REPO}/actions/runs/${RUN_ID}"
          fi

  notify-failure:
    needs: [detect, ingest]
    if: always() && (needs.detect.result == 'failure' || needs.ingest.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BODY="The nightly ingest-channel workflow failed. See run: ${SERVER}/${REPO}/actions/runs/${RUN_ID}"
          # Distinct label set (not "ingest,automated") so failure notices can
          # never be matched by the tracking-issue queries above, which search
          # --label ingest,automated. Ensure labels exist so issue creation
          # never fails on a missing label.
          gh label create ingest-failure --repo "${REPO}" --color b60205 --description "Nightly ingest-channel workflow failure" --force
          gh label create bug --repo "${REPO}" --color d73a4a --description "Something isn't working" --force
          gh issue create \
            --repo "${REPO}" \
            --title "channel-watcher: nightly run FAILED (${DATE})" \
            --body "${BODY}" \
            --label "ingest-failure,bug"
