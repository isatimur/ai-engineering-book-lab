name: diagrams-check

# Enforces that:
#   - Every .excalidraw source has a rendered .png next to it.
#   - No source was committed after its .png (i.e. nothing needs re-rendering).
#   - Every rendered .png is mirrored to website/public/diagrams/ with the
#     manifest's renamed format, byte for byte.
#
# Render itself runs locally (needs Playwright/Chromium via the excalidraw
# skill) so this CI only verifies. If anything is stale, it fails with
# instructions on how to fix it.
#
# It did NOT do that until 2026-11-15. The old `sync-diagrams.sh --check`
# step used `stat -f %m`, BSD syntax that GNU coreutils reads as *file
# system*, so every call errored on ubuntu-latest; the error was swallowed
# by the `elif` it sat in, the counter stayed 0, and the step printed
# "0 stale, 0 missing-source" every day while touching nothing. The logic
# now lives in scripts/check_diagram_sync.py, which runs identically on a
# laptop and a runner and is exercised by its own negative controls.

on:
  push:
    branches: [main]
    paths:
      - 'diagrams/**'
      - 'website/public/diagrams/**'
      - 'website/src/data/diagram-manifest.json'
      - 'scripts/sync-diagrams.sh'
      - 'scripts/check_diagram_sync.py'
      - 'website/scripts/sync-diagrams.mjs'
      # Three diagrams quote the corpus size and theme ranking, so the stats
      # file is an input to them even though it lives nowhere near diagrams/.
      - '99_Meta/Corpus Stats.md'
  pull_request:
    paths:
      - 'diagrams/**'
      - 'website/public/diagrams/**'
      - 'website/src/data/diagram-manifest.json'
      - 'scripts/sync-diagrams.sh'
      - 'scripts/check_diagram_sync.py'
      - 'website/scripts/sync-diagrams.mjs'
      - '99_Meta/Corpus Stats.md'
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC daily safety net
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing. The check compares the last commit
      # touching a .excalidraw against the last commit touching its .png;
      # the default shallow clone has neither, and the check would report
      # "freshness unproven" for every entry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diagrams are rendered, synced and current
        run: python3 scripts/check_diagram_sync.py

      # Freshness is not truth. Both checks above passed every day while the
      # theme map told readers the corpus held 794 videos and it held 1,468,
      # and while the chart's biggest bar named a theme that had fallen to
      # fourth. A PNG newer than its source proves only that someone rendered
      # it, not that what it says is still so.
      #
      # Tolerance is deliberate. The corpus grows most nights, so a check that
      # demanded an exact match would fail on every ingest PR and be routed
      # around inside a week. It fails on a chart whose SHAPE is wrong —
      # reordered rows, a recoloured bar, a re-pointed chapter label — at any
      # tolerance, and on a printed total more than 5% behind the real one.
      - name: Check the corpus diagrams still tell the truth
        run: python3 diagrams/_update_corpus_counts.py --check

      - name: Open issue on scheduled-run drift
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BODY="Scheduled diagrams-check detected drift between sources and rendered/synced PNGs.
          See run: ${SERVER}/${REPO}/actions/runs/${RUN_ID}

          Fix locally:
          \`\`\`bash
          ./scripts/sync-diagrams.sh
          \`\`\`"
          gh issue create \
            --repo "${REPO}" \
            --title "diagrams-check: drift detected (${DATE})" \
            --body "${BODY}" \
            --label "diagrams,automated"
