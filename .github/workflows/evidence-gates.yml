name: evidence-gates

# The anchor gates under 99_Meta/scripts/anchor/ check that the books only put
# words in a named person's mouth that the person actually said.
#
# WHY THIS WAS NEVER IN CI, AND WHAT IT NEEDS
#
# Every one of these gates resolves a quote against the talk transcripts in
# 99_Meta/transcripts/. That directory is gitignored (26 MB, .gitignore line 19)
# and lives in the PRIVATE mirror isatimur/ai-engineer-corpus-transcripts. A
# runner that checks out only this repo has no transcripts, so verify_ledger
# reports "no transcript on disk" for every anchor and the whole job fails. That
# is a hard constraint, not an oversight — I assumed the latter first and pushed
# a job that could not pass (run 35230701374).
#
# So this job is dormant until a CORPUS_TOKEN secret exists with read access to
# the mirror. Until then it is SKIPPED, not failed: a red check nobody can fix
# is worse than no check. To enable, add a fine-grained PAT with contents:read
# on isatimur/ai-engineer-corpus-transcripts as the CORPUS_TOKEN secret.
#
# Blocking vs advisory is decided by whether a check has a legitimate nonzero
# baseline, not by how serious it sounds:
#
#   verify_ledger          blocking   already returns 1 on failure; one step per
#                                     book, since it defaults to book 1's ledger
#   check_quote_speakers   blocking   both books sit at 0 candidates
#   check_title_quotes     blocking   both books sit at 0
#   verify_prose_quotes    ceiling    nonzero baseline by design (drifted,
#                                     external, self-quotation), so it fails on
#                                     a RISE, not on a count
#   check_dropped_quotes   advisory   a ~1-in-6 candidate detector with a
#                                     standing adjudicated hit; blocking on it
#                                     would fail every run forever
#
# The ceilings live here, not as script defaults, so raising one shows up in a
# diff and needs a reviewer.

on:
  push:
    branches: [main]
    paths:
      - 'public/drafting/**'
      - 'public/drafting-2/**'
      - 'claims/**'
      - 'claims-2/**'
      - '01_Videos/**'
      - '99_Meta/scripts/anchor/**'
      - '.github/workflows/evidence-gates.yml'
  pull_request:
    paths:
      - 'public/drafting/**'
      - 'public/drafting-2/**'
      - 'claims/**'
      - 'claims-2/**'
      - '01_Videos/**'
      - '99_Meta/scripts/anchor/**'
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC daily safety net
  workflow_dispatch:

env:
  # Current unmatched counts. A rise means a newly printed quote appears in no
  # transcript. Lower these when a pass reduces them; raise only deliberately.
  BOOK1_MAX_UNMATCHED: '30'
  BOOK2_MAX_UNMATCHED: '11'

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # A secret cannot be referenced from a job-level `if:` — GitHub rejects the
      # whole workflow file if you try (run 35231664682). Reading it into env and
      # branching on a step output is the supported way to make a job dormant.
      CORPUS_TOKEN: ${{ secrets.CORPUS_TOKEN }}
    steps:
      - name: Is the transcript corpus reachable?
        id: guard
        run: |
          if [ -z "${CORPUS_TOKEN}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CORPUS_TOKEN is not set, so the transcript corpus is"
            echo "::notice::unreachable and every gate below would be vacuous."
            echo "::notice::Skipping. See this workflow's header to enable."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'

      # The transcripts are the evidence. Without them every gate below is
      # vacuous, so this checkout is a precondition, not a convenience.
      - name: Check out the transcript corpus
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: isatimur/ai-engineer-corpus-transcripts
          token: ${{ secrets.CORPUS_TOKEN }}
          path: 99_Meta/transcripts

      - name: Confirm the corpus is actually present
        if: steps.guard.outputs.enabled == 'true'
        run: |
          COUNT=$(find 99_Meta/transcripts/plain -name '*.txt' 2>/dev/null | wc -l)
          echo "transcripts on disk: ${COUNT}"
          if [ "${COUNT}" -lt 500 ]; then
            echo "::error::Only ${COUNT} transcripts present. The gates below would"
            echo "::error::pass vacuously against a corpus that is not there."
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.enabled == 'true'
        with:
          python-version: '3.11'

      # verify_ledger defaults to book 1's ledger and takes --ledger for book 2,
      # so it needs one step per book. A single invocation silently covers only
      # book 1 while reading as if it covered both.
      - name: Ledger anchors resolve — book 1 (blocking)
        if: steps.guard.outputs.enabled == 'true'
        run: python3 99_Meta/scripts/anchor/verify_ledger.py

      - name: Ledger anchors resolve — book 2 (blocking)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python3 99_Meta/scripts/anchor/verify_ledger.py \
            --ledger 'claims-2/Claims Ledger.md'

      - name: Quote speakers — book 1 (blocking)
        if: steps.guard.outputs.enabled == 'true'
        run: python3 99_Meta/scripts/anchor/check_quote_speakers.py --strict

      - name: Quote speakers — book 2 (blocking)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python3 99_Meta/scripts/anchor/check_quote_speakers.py \
            --glob 'public/drafting-2/*.md' --strict

      - name: Title-as-speech — book 1 (blocking)
        if: steps.guard.outputs.enabled == 'true'
        run: python3 99_Meta/scripts/anchor/check_title_quotes.py --strict

      - name: Title-as-speech — book 2 (blocking)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python3 99_Meta/scripts/anchor/check_title_quotes.py \
            --glob 'public/drafting-2/*.md' --strict

      - name: Prose quotes verbatim — book 1 (ceiling)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python3 99_Meta/scripts/anchor/verify_prose_quotes.py \
            --max-unmatched "${BOOK1_MAX_UNMATCHED}"

      - name: Prose quotes verbatim — book 2 (ceiling)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python3 99_Meta/scripts/anchor/verify_prose_quotes.py \
            --glob 'public/drafting-2/*.md' \
            --max-unmatched "${BOOK2_MAX_UNMATCHED}"

      - name: Dropped ledger quotes still in prose (advisory)
        if: steps.guard.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          for b in 1 2; do
            echo "--- book $b ---"
            python3 99_Meta/scripts/anchor/check_dropped_quotes_in_prose.py \
              --since a7de746 --book "$b" || true
          done

      - name: Open issue on scheduled-run failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BODY="The scheduled evidence-gates run failed. One of the books is attributing words to a named person that the transcripts do not support, or a ledger anchor stopped resolving.

          See run: ${SERVER}/${REPO}/actions/runs/${RUN_ID}

          Fix the prose or the ledger. Do not raise a ceiling to make this pass without a reviewed reason."
          gh issue create \
            --repo "${REPO}" \
            --title "evidence-gates: attribution or anchor failure (${DATE})" \
            --body "${BODY}" \
            --label "automated"
