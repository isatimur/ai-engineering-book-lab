name: evidence-regen

on:
  push:
    branches: [main]
    paths:
      - 'claims/Claims Ledger.md'
      - 'claims/anchors/**'
      - 'claims-2/Claims Ledger.md'
      - '99_Meta/scripts/anchor/**'

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # needed to dispatch website-deploy after a real change
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python deps (if any)
        run: |
          if [ -f 99_Meta/scripts/anchor/requirements.txt ]; then
            pip install -r 99_Meta/scripts/anchor/requirements.txt
          fi
      - name: Regenerate evidence.json
        run: |
          python 99_Meta/scripts/anchor/build_evidence.py
          python 99_Meta/scripts/anchor/build_evidence.py \
            --ledger 'claims-2/Claims Ledger.md' \
            --out website/src/evidence-2.json
      # Same defect as stats-regen, same fix. These two jobs trigger on
      # overlapping paths under claims/** and race each other to push, and
      # rebasing a generated file onto a tree that has moved republishes a
      # value computed from the old tree. See scripts/commit_regenerated.sh.
      - name: Commit changes (if any)
        id: commit
        run: |
          scripts/commit_regenerated.sh \
            --message "chore(evidence): regenerate evidence.json and evidence-2.json from updated ledgers [skip ci]" \
            --regen "python 99_Meta/scripts/anchor/build_evidence.py && python 99_Meta/scripts/anchor/build_evidence.py --ledger 'claims-2/Claims Ledger.md' --out website/src/evidence-2.json" \
            -- website/src/evidence.json website/src/evidence-2.json

      # Both regenerated files live under website/, so they reach production
      # only on a deploy — and a GITHUB_TOKEN push starts no workflow. Without
      # this the site keeps serving the previous evidence set.
      - name: Deploy the site so the new evidence is the published evidence
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run website-deploy.yml --ref main
